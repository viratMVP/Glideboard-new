name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip project
        run: unzip glideboard.zip -d project

      - name: Decode Keystore
        run: |
          if [ -f "project/debug.keystore.base64" ]; then
            base64 -d project/debug.keystore.base64 > project/debug.keystore
            echo "✅ Keystore created!"
            ls -la project/debug.keystore
          else
            echo "❌ Base64 file not found!"
            find project -name "*.base64" -o -name "*.keystore"
          fi

      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GlideBoard-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
