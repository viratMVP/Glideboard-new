name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip project
        run: |
          unzip glideboard.zip -d project
          echo "=== ZIP Contents ==="
          find project -maxdepth 3 | head -40

      - name: Generate Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cp ~/.android/debug.keystore project/debug.keystore
          cp ~/.android/debug.keystore project/app/debug.keystore
          echo "✅ Keystore ready!"

      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v4
        with:
          name: GlideBoard-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
