name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip project
        run: unzip glideboard.zip -d project

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          base64 -d project/debug.keystore.base64 > project/debug.keystore
          cp project/debug.keystore project/app/debug.keystore
          cp project/debug.keystore ~/.android/debug.keystore
          echo "Keystore locations:"
          ls -la project/debug.keystore
          ls -la project/app/debug.keystore
          echo "--- Signing config in build.gradle ---"
          grep -A 10 -i "signing\|keystore" project/app/build.gradle.kts || true

      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GlideBoard-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
